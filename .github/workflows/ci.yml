name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Validate source
        run: node scripts/check.mjs
      - name: Run tests
        run: node --test
      - name: Coverage summary
        run: node --test --experimental-test-coverage
